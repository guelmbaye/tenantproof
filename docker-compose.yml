services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantproof
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: tenantproof
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantproof"]
      interval: 2s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      DEMO_SEED: "true"
      JWT_SECRET: "dev-only-insecure-32-characters-change-me"
      DATABASE_URL: postgresql+psycopg://tenantproof:local_demo_only@db:5432/tenantproof
    depends_on:
      db:
        condition: service_healthy
